# 증강 KF 기본 설정 (.claude/rules/ekf-baseline.md).
# 증강상태 = [v_y, gamma, e_psi, e_y, d_vy, d_gamma], 측정 = 전상태 [v_y,gamma,e_psi,e_y].
# 이름은 MPC(W_/R_)와 절대 겹치지 않게 Q_kf/R_kf (mpc-solver.md 표기 충돌).
#
# 측정 = 전상태 (Phase 6 진단): 부분관측(v_y 미측정)이면 d_vy 가 이중적분 뒤에야
# 관측되어 지연·과대추정 -> MPC+KF 가 MPC-only 보다 나빠짐. 전상태로 두면 깨끗한
# 외란관측기가 되어 MPC+KF 가 MPC-only 를 이긴다(+~7%, 오라클 상한 근접).

# 프로세스 잡음 연속 공분산 대각(6). 예측에서 *dt 이산화.
# 상태는 작게(명목 모델이 외란 빼면 정확), 외란 d 는 크게(빠른 반응 필요).
# 전상태 측정이 상태를 고정하므로 Q_d 를 키워도 잡음을 외란으로 오인하지 않는다.
# d 스케일 근거: Phase 5 연속외란 d_vy~0.65 m/s^2, d_gamma~0.06 rad/s^2.
Q_kf_diag: [1.0e-6, 1.0e-6, 1.0e-8, 1.0e-8, 1.0, 1.0e-1]   # TODO Phase 8 공정튜닝

# 측정 잡음 공분산 대각(4) = [v_y, gamma, e_psi, e_y].
# v_y std~0.01 m/s, gamma~0.001 rad/s, e_psi~0.001 rad, e_y 측위~0.01 m.
R_kf_diag: [1.0e-4, 1.0e-6, 1.0e-6, 1.0e-4]                # TODO Phase 8 공정튜닝

# 초기 추정 공분산 대각(6). d-블록은 작게(초기 전이 스파이크 완화).
P0_diag: [0.5, 0.05, 0.01, 0.01, 0.5, 0.1]

# 튜닝 예산 기록 (공정성 — ekf-baseline.md 「튜닝 예산을 기록한다」).
# GP 와 **같은 형식·같은 횟수**로 남긴다. configs/gp/default.yaml 의 대응 항목 참조.
# Phase 8 결정: 두 방법의 자유 손잡이에 in-distribution 폐루프 평가를 같은 횟수 배정하고,
# (b) a_y=6 / (c) dlc 결과를 본 뒤에는 어느 쪽도 손대지 않는다.
tuning_method: closed_loop_grid
tuning_budget_closed_loop_evals: 20   # 자유 손잡이(Q_d 스케일, R_kf 스케일) 탐색
tuning_selection_scenario: part1_kf_ay4   # in-distribution 만 보고 결정. (b)(c) 열람 금지
