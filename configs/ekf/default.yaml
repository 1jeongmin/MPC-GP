# 증강 KF 기본 설정 (.claude/rules/ekf-baseline.md).
# 증강상태 = [v_y, gamma, e_psi, e_y, d_vy, d_gamma], 측정 = [gamma, e_psi, e_y].
# 이름은 MPC(W_/R_)와 절대 겹치지 않게 Q_kf/R_kf (mpc-solver.md 표기 충돌).
#
# 아래 값은 제안 초기값이다 (TODO: 수동 그리드로 튜닝, 튜닝 예산을 리포트에 기록).
# 공정성: GP 하이퍼파라미터 탐색 노력과 같은 형식으로 로그에 남긴다.

# 프로세스 잡음 연속 공분산 대각(6). 예측에서 *dt 이산화.
# 상태는 작게(명목 모델이 외란 빼면 정확), 외란 d 는 중간(과대하면 잡음을 외란으로
# 오인해 매칭에서도 d_hat 이 튄다 — Phase 6 진단으로 확인).
# 검증: 이 값에서 매칭(선형) 플랜트 수동관측 시 |d_hat|mean ~= 0.015 (편향 없음).
# d 스케일 근거: Phase 5 연속외란 d_vy~0.65 m/s^2, d_gamma~0.06 rad/s^2.
Q_kf_diag: [1.0e-7, 1.0e-7, 1.0e-9, 1.0e-9, 1.0e-3, 2.0e-5]   # TODO Phase 8 공정튜닝

# 측정 잡음 공분산 대각(3) = [gamma, e_psi, e_y].
# gamma 요레이트센서 std~0.001 rad/s, e_psi~0.001 rad, e_y 측위~0.01 m.
R_kf_diag: [1.0e-6, 1.0e-6, 1.0e-4]                            # TODO Phase 8 공정튜닝

# 초기 추정 공분산 대각(6). d-블록은 작게(초기 전이 스파이크 완화).
P0_diag: [0.5, 0.05, 0.01, 0.01, 0.1, 0.01]

tuning_method: manual   # 수동 그리드 (공정성: 방식 명시). Phase 8 에서 튜닝예산 기록.
# 주의: 현재 값은 정상 기본값이나 공정 비교용 튜닝은 아니다. Phase 8 에서 GP
# 하이퍼파라미터 탐색과 같은 예산으로 Q_kf/R_kf 를 튜닝하고 그 예산을 리포트한다.
