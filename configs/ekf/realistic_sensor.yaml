# 현실적 센서용 증강 KF 설정 (Phase 8c).
#
# default.yaml 과 **유일한 차이는 R_kf** 다. 나머지(Q_kf, P0)는 동일하게 유지해
# 잡음 도입 외의 변화를 만들지 않는다.
#
# ## R_kf 를 왜 바꾸는가 — 공정성
# configs/sensor/realistic.yaml 이 실제로 주입하는 잡음 std 는
#   [0.03, 0.002, 0.003, 0.03]  -> 분산 [9e-4, 4e-6, 9e-6, 9e-4]
# 인데 default.yaml 의 R_kf 는 [1e-4, 1e-6, 1e-6, 1e-4] 로 **실제보다 작다.**
# 그대로 두면 KF 가 측정을 과신해 잡음을 그대로 따라가고, 이는 비교군을 실수로
# 약화시키는 설정이다 (ekf-baseline.md 「의도적/실수로 낮추는 설정을 발견하면 보고」).
# 실차에서도 R 은 센서 데이터시트에서 온다. 따라서 실제 잡음 분산과 일치시킨다.

# ## Q_d 이력 — 한 번 잘못 튜닝됐다가 되돌렸다 (반드시 읽을 것)
#
# ### (1) Phase 8c: 처음엔 R_kf 만 센서에 맞추고 Q_kf 는 default 를 그대로 뒀다
# 그 결과 rtn_ay6 에서 **KF 가 발산했다** (d_hat 이 3929 m/s^2 까지 폭주, 참 외란
# 스케일은 ~0.65. delta 76% 포화, IPOPT 수렴실패 0% -> 솔버가 아니라 폐루프 발산).
# 원인: 필터 거동을 정하는 것은 Q/R **비율**인데 R 만 키우고 Q_d 는 크게 남겨둬,
# 측정잡음을 외란으로 오인 -> MPC 과격 조향 -> 양성 피드백. 그래서 재튜닝했는데,
#
# ### (2) 그 재튜닝이 **잘못된 목적함수**를 썼다 (미결 #4 위반)
# 당시 d 블록 8점 그리드를 **RMS e_y(추종오차)** 로 평가해 scale 0.1 을 골랐다:
#   1.0 -> 1.3714e-2 | 0.3 -> 1.3583e-2 | 0.1 -> 1.3532e-2 | ... (차이 1.3%)
# 그러나 미결 #4 는 "KF 튜닝 목적함수 = 추정/외란 RMSE 이지 **추종오차가 아니다**"로
# 확정돼 있다. 추종오차는 세 케이스가 공유하는 MPC·경로에 지배되므로 필터 품질을
# 거의 반영하지 못한다(위 표에서 8점 전체가 1.3% 안에 몰린 것이 그 증거다).
# 이렇게 고른 scale 0.1 이 **Q_d 를 10배 낮춰 P_d 를 과소하게 만들었고**, 그것이
# rtf_ay6 에서 관측된 심한 과신(z_std=5.35, 95%커버 51.3%, NLPD=+8.49)의 직접 원인이다.
#
# ### (3) 2026-07-30 올바른 목적함수로 재튜닝 -> **default.yaml 값으로 복귀**
# scripts/tune_kf.py ekf (재현 가능. 이전 튜닝은 스크립트가 없어 재현 불가였다).
# 주 지표 = **정규화 외란 RMSE 합** (G@d_hat 이 참 1스텝 잔차를 얼마나 맞히는가.
# 1.0 = 보정 안 한 것과 동일, <1 = 실제로 잔차를 줄임), 부 지표 = mean(NIS), 목표 4.
# in-distribution(rtf_ay4)만 보고 결정. rtf_ay6 열람 금지.
#   scale  0.1 -> 1.2904 (NIS 8.56) |  0.3 -> 1.1736 (6.77) |  1.0 -> 1.0355 (5.39)
#          3.0 -> 0.9299 (4.61) | **10.0 -> 0.8867 (4.09)  <- 두 기준 모두 최적**
#          30  -> 0.9515 (3.77) | 100  -> 1.1563 (3.47)
# 주 지표와 NIS 가 **같은 지점**을 가리켰다. scale 10 을 채택한다.
# 부수 결과(맞춘 대상이 아니라 결과다): z_std 2.209 -> 0.931, 95%커버 73.5% -> 94.6%.
#
# scale 10 을 곱하면 d 블록이 [1.0, 1.0e-1] 이 되는데 이는 **default.yaml 과 같은 값**
# 이다. 즉 (2)의 잘못된 튜닝이 낮춘 것을 원위치시킨 셈이다. (1)의 발산은 Q_d 가 아니라
# R_kf 가 센서와 안 맞아서 생긴 문제였고, R 을 맞춘 지금은 Q_d 를 되돌려도 발산하지 않는다
# (rtf_ay4/ay6 재실행으로 확인 — handoff.md).
Q_kf_diag: [1.0e-6, 1.0e-6, 1.0e-8, 1.0e-8, 1.0, 1.0e-1]

# 센서 사양과 정확히 일치 (= noise_std^2).
R_kf_diag: [9.0e-4, 4.0e-6, 9.0e-6, 9.0e-4]

P0_diag: [0.5, 0.05, 0.01, 0.01, 0.5, 0.1]                 # default 와 동일

tuning_method: R_matched_to_sensor_spec + Q_d_grid_on_disturbance_rmse + nis_consistency
tuning_budget_closed_loop_evals: 15   # 8(옛 추종오차 그리드, 폐기) + 7(올바른 재튜닝). 예산 20 이내
tuning_selection_scenario: part1_kf_rtf_ay4   # in-distribution 만. (ay6 열람 금지)
