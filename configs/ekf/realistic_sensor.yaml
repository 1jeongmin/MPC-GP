# 현실적 센서용 증강 KF 설정 (Phase 8c).
#
# default.yaml 과 **유일한 차이는 R_kf** 다. 나머지(Q_kf, P0)는 동일하게 유지해
# 잡음 도입 외의 변화를 만들지 않는다.
#
# ## R_kf 를 왜 바꾸는가 — 공정성
# configs/sensor/realistic.yaml 이 실제로 주입하는 잡음 std 는
#   [0.03, 0.002, 0.003, 0.03]  -> 분산 [9e-4, 4e-6, 9e-6, 9e-4]
# 인데 default.yaml 의 R_kf 는 [1e-4, 1e-6, 1e-6, 1e-4] 로 **실제보다 작다.**
# 그대로 두면 KF 가 측정을 과신해 잡음을 그대로 따라가고, 이는 비교군을 실수로
# 약화시키는 설정이다 (ekf-baseline.md 「의도적/실수로 낮추는 설정을 발견하면 보고」).
# 실차에서도 R 은 센서 데이터시트에서 온다. 따라서 실제 잡음 분산과 일치시킨다.

# ## Q_d 재튜닝이 필요했던 이유 (반드시 읽을 것)
# 처음엔 R_kf 만 센서에 맞추고 Q_kf 는 default(이상적 센서 시절 값)를 그대로 뒀다.
# 그 결과 rtn_ay6 에서 **KF 가 발산했다** (d_hat 이 3929 m/s^2 까지 폭주, 참 외란
# 스케일은 ~0.65. delta 76% 포화, IPOPT 수렴실패 0% -> 솔버가 아니라 폐루프 발산).
# 원인: 필터 거동을 정하는 것은 Q/R **비율**인데 R 만 키우고 Q_d 는 크게 남겨둬,
# 측정잡음을 외란으로 오인 -> MPC 과격 조향 -> 상태 변화 -> 더 큰 외란 추정의
# 양성 피드백이 걸렸다. 이것은 ekf-baseline.md 가 금지하는 '실수로 비교군을
# 약화시키는 설정'이므로 재튜닝했다.
#
# 튜닝 프로토콜 (GP 와 동일 예산): d 블록 스케일 8점 그리드,
# **in-distribution(rtn_ay4)만 보고 결정**, 평가 시나리오(rtn_ay6) 결과는 보지 않음.
#   scale 1.0 -> RMS e_y 1.3714e-2 |  0.3 -> 1.3583e-2 |  **0.1 -> 1.3532e-2 (최적)**
#   0.03 -> 1.3551e-2 | 0.01 -> 1.3741e-2 | 3e-3 -> 1.4159e-2 | 1e-3 -> 1.4631e-2
# in-distribution 에서는 차이가 1.3% 로 작다. 스케일 0.1 을 채택한다.
Q_kf_diag: [1.0e-6, 1.0e-6, 1.0e-8, 1.0e-8, 1.0e-1, 1.0e-2]

# 센서 사양과 정확히 일치 (= noise_std^2).
R_kf_diag: [9.0e-4, 4.0e-6, 9.0e-6, 9.0e-4]

P0_diag: [0.5, 0.05, 0.01, 0.01, 0.5, 0.1]                 # default 와 동일

tuning_method: R_matched_to_sensor_spec + Q_d_closed_loop_grid
tuning_budget_closed_loop_evals: 8    # 예산 20 이내. GP 는 별도 튜닝 안 함(동일 설정 유지).
tuning_selection_scenario: part1_kf_rtn_ay4   # in-distribution 만. (ay6 열람 금지)
