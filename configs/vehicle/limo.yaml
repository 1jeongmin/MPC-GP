# AgileX LIMO (Ackermann). 아래 값은 전부 미검증 추정치다.
# TODO 주석을 절대 지우지 마라 (.claude/rules/vehicle-model.md "config 취급").
# LIMO 결과를 보고할 때는 파라미터가 식별되지 않았다는 사실을 항상 함께 적는다.
#
# 이 조합은 a == b, Cf == Cr 이므로 K_us 가 정확히 0 (뉴트럴 스티어),
# critical_speed 는 inf 다. 게이트 2의 뉴트럴 케이스로 그대로 쓸 수 있다.
# 단 K_us == 0 을 부동소수점 등호로 판정하지 마라 (abs(K_us) < tol).
m: 4.2                # kg      (TODO: 실측 필요)
Iz: 0.05              # kg*m^2  (TODO: 직육면체 근사 Iz = m*(l^2+w^2)/12,
                      #          l~0.32 w~0.22 기준. 실측/식별로 대체할 것)
a: 0.1                # m       (TODO: CG가 축간 중앙이라는 가정)
b: 0.1                # m       (TODO: 동일)
Cf: 200.0             # N/rad   (TODO: 근거 없음. 축하중 약 20N에 Ca ~ 10*Fz 경험칙을
                      #          적용한 자릿수 추정. 반드시 식별 실험으로 대체할 것)
Cr: 200.0             # N/rad   (TODO: 동일)
delta_max: 0.5        # rad     (TODO: 실제 조향 한계 확인 필요)
delta_rate_max: 2.0   # rad/s   (TODO)
vx_range: [0.2, 1.0]  # m/s     하한이 특히 빡빡하다 (특이점 vx->0 방어)
