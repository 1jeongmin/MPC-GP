# 검증 기준 차량 (sedan). 게이트 1(정상상태 요레이트)의 기준값 출처.
# 이 조합은 K_us > 0 (언더스티어)이며, vx=15, delta=0.02 에서
# 정상상태 a_y ~= 1.4 m/s^2 로 선형 타이어 영역 안이다.
m: 1500.0             # kg,      질량
Iz: 2250.0            # kg*m^2,  요 관성모멘트
a: 1.2                # m,       CG -> 전축 거리
b: 1.5                # m,       CG -> 후축 거리
Cf: 80000.0           # N/rad,   전축 코너링 강성 (축당, 양수)
Cr: 80000.0           # N/rad,   후축 코너링 강성 (축당, 양수)
delta_max: 0.5        # rad,     조향각 한계
delta_rate_max: 1.0   # rad/s,   조향각속도 한계
vx_range: [5.0, 25.0] # m/s,     종속도 유효 범위 (하한 > 0 강제)
