# 현실적 상태 측정 센서 (Phase 8c).
#
# 이 그룹을 참조하는 experiment 는 제어 피드백에 **참 상태 대신 측정값**이 들어간다.
# 참조하지 않으면 종전대로 이상적 센서다 (Phase 8 까지의 모든 결과가 그대로 재현됨).
#
# 채널 순서 = 상태 순서 [v_y, gamma, e_psi, e_y].
#
# 잡음 크기 근거 — **특정 논문 수치가 아니라 센서 등급별 통상값 기준의 공학적 추정치다.**
# 문헌 인용이 필요하면 실제 센서 데이터시트로 대체하라.
#   v_y   0.03 m/s   : 광학/GPS-INS 횡속도계 연구용 등급.
#                      (주의 — 양산차에는 v_y 를 직접 재는 센서가 없다. Phase 6 에서
#                       전상태 측정으로 확정한 전제를 그대로 이어받은 것이다.)
#   gamma 0.002 rad/s: 차량용 MEMS 자이로 (~0.11 deg/s).
#   e_psi 0.003 rad  : GPS/INS 헤딩 (~0.17 deg).
#   e_y   0.03 m     : RTK-GPS + 맵매칭 오차 합.
noise_std: [0.03, 0.002, 0.003, 0.03]

# 결정론적 사인 바이어스 — **기본 0 (끔).**
# 켜면 KF 의 '측정잡음은 영평균 백색' 가정이 깨져 KF 만 일방적으로 불리해진다.
# ekf-baseline.md 가 금지하는 '비교군 약화'에 해당하므로, 쓰려면 그 사실을 리포트에
# 명시하고 R_kf 재설계까지 함께 해야 한다.
bias_amp: [0.0, 0.0, 0.0, 0.0]
bias_freq_hz: 0.0

note: "가우시안 백색잡음. 사인 바이어스는 공정성 문제로 기본 비활성."
