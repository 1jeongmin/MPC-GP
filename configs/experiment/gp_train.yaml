# GP 학습 데이터 수집 전용 experiment (Phase 8).
#
# 이 파일이 GP 의 **유일한 학습 출처**다. configs/gp/default.yaml 의
# train_experiment 가 이 이름을 가리킨다. 평가 시나리오(part1_*)와 분리되어 있어야
# "학습 궤적과 평가 궤적을 분리한다"(gp-residual.md 데이터 위생)가 구조적으로 보장된다.
#
# 학습 조건 = in-distribution: single_curve, a_y=4.0 (path 기본값), 비선형 플랜트,
# 명목 MPC 주행. Phase 7 에서 확정한 학습 설정과 동일하다.
#
# **gp 그룹을 참조하면 안 된다** (순환 — assemble.py 가 거부한다).
# 평가 결과가 나쁘다고 이 파일의 경로·a_y 를 바꾸지 마라. 그것은 학습 데이터를
# 몰래 늘리는 것이고 gp-residual.md 가 금지한다.
vehicle: sedan
sim: default
path: single_curve
mpc: default
plant: nonlinear
