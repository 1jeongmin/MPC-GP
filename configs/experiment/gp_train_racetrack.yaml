# 레이싱 트랙 GP 학습 데이터 수집 전용 experiment.
#
# configs/gp/racetrack.yaml 의 train_experiment 가 이 이름을 가리킨다.
# 학습 조건 = in-distribution: racetrack, a_y=4.0(트랙 config 기본값), 비선형 플랜트,
# 명목 MPC 주행. 평가 시나리오(part1_*_rt_*)와 분리되어 있어야 데이터 위생이 지켜진다.
#
# **gp 그룹을 참조하면 안 된다** (순환 — assemble.py 가 거부한다).
# 평가 결과가 나쁘다고 이 파일의 경로·a_y 를 바꾸지 마라.
vehicle: sedan
sim: racetrack
path: racetrack
mpc: default
plant: nonlinear
