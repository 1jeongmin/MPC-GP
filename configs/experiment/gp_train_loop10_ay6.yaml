# GP 학습 전용 experiment — loop10 10바퀴, **a_y_max = 6.0** (강도 상향 학습).
#
# 기준선 `gp_train_loop10.yaml`(a_y 4.0)과 **overrides 한 줄만** 다르다.
# 학습 출처를 바꾸는 실험이므로 나머지(차량·경로 형상·MPC·플랜트·센서·상태추정기·seed)는
# 전부 동일해야 한다 (sim-experiment.md 「통제해야 할 변수」).
#
# ## 왜 (2026-08-03, 사용자 제안)
#
# 4케이스 측정에서 ③형상외삽(rtf_ay4)은 견디는데(z_std 1.64/커버 89.9%) ④형상+강도
# (rtf_ay6)에서 무너진다(2.91/54.2%). 그렇다면 **강도를 학습쪽으로 옮기면** 어떻게 되나 —
# ay6 로 학습하고 ay4 에서 평가하면 강도축이 외삽이 아니라 **내삽**이 된다.
# "외삽이라서 못 하는 것"인지 "그 영역을 안 배워서 못 하는 것"인지 가르는 실험이다.
#
# ## 이 경로에서 a_y 를 올리면 실제로 무엇이 넓어지나 (측정, 2026-08-03)
#
#            vx 평균   상한25 도달   |a_y| 평균   |a_y| p95/최대
#   ay4      22.97      67.9%        2.297       4.000
#   ay6      23.68      81.4%        2.705       6.000
#
# 코스의 대부분(81.4%)은 `vx_range` 상한 25 m/s 에 걸려 **두 설정이 동일**하고, 차이는
# 타이트 코너에만 집중된다. 잔차가 큰 구간이 바로 거기라 실험 취지에는 맞다.
#
# ## ★ 주의 — "포함관계"가 아니다
#
# ay6 학습이 ay4 상태영역을 **포함하지 않는다.** 타이트 코너를 더 빠르게 돌므로 ay4 가
# 그 코너에서 겪는 느린 상태는 ay6 학습 궤적에 아예 안 나올 수 있다. 강도축이 위로
# 넓어지는 동시에 아래가 비는 **이동(shift)** 이지 확장이 아니다. 결과 해석 때
# 평가점의 학습범위 내포율을 함께 봐야 한다.
vehicle: sedan
sim: gp_train_loop10
path: loop10
mpc: default
plant: nonlinear
sensor: realistic
state_kf: default
overrides:
  path.a_y_max: 6.0
