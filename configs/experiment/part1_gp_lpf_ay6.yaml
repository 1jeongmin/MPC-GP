# Part 1 / 케이스 2 = **학습맵(loop10) + 가속도 증가(a_y=6)** / GP 잔차 보정.
#
# 경로는 학습맵과 같지만 a_y 가 4->6 이라 **강도 외삽**이다 — 작동점 (v_y, gamma,
# delta) 이 학습 분포 밖으로 밀려난다. 케이스 1(lpf_ay4, in-distribution)과 짝을
# 이뤄 "경로는 같은데 강도만 달라졌을 때" 를 분리해 본다.
# 여기서 사후분산이 커지고도 커버리지가 유지되면 UQ 주장 성립, 무너지면 그대로 보고.
# GP 는 재학습하지 않는다 (학습 출처는 gp_train_loop10 a_y=4 고정).
vehicle: sedan
sim: loop10
path: loop10
mpc: default
gp: loop10
plant: nonlinear
sensor: realistic
state_kf: default
overrides:
  path.a_y_max: 6.0
