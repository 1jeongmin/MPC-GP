# loop10 학습 GP — **입력의존 잡음(이분산)**. 미결 #17(OOD 과신) 대응.
#
# 기준선 loop10.yaml 과 **noise_model 하나만** 다르다. M·하이퍼파라미터·학습 출처가
# 전부 같아야 잡음 모델의 효과만 분리해서 볼 수 있다.
#
# ## 왜 (2026-08-03 측정)
#
# 등분산(sigma_n 상수 하나) 가정이 심하게 틀렸다는 것이 측정으로 확인됐다.
# 학습 분포 **안**(a_y=4)에서 GP 평균을 뺀 잔여 산포:
#
#   |gamma| 구간      실제 std(r-mu)   GP 예측 sigma   비율
#   0.000~0.016          7.6e-5          6.34e-4      0.12   <- 8배 과대(겁먹음)
#   0.174~0.286          1.28e-3         6.56e-4      1.95   <- 2배 과소(**과신**)
#
# **실제 산포는 6.9배(v_y)/5.5배(gamma) 변하는데 예측 sigma 는 1.0배(상수)다.**
# 상수 하나로 직선과 한계 코너를 동시에 덮을 방법이 없으므로 과대·과신이 구조적으로
# 강제된다. OOD(a_y=6)는 "코너가 더 험해진 것"이라 과신이 더 심해진다
# (rtf_ay6: z_std=2.914, 95%커버 54.2%).
#
# ## 천장 문제와의 관계 — 채널마다 다르다 (rtf_ay6 실측)
#
#   v_y  : 실제 오차 1.411e-2 > 천장 sigma 1.006e-2  -> **천장이 실제로 걸린다**
#   gamma: 실제 오차 3.094e-3 < 천장 sigma 6.862e-3  -> 천장은 2.2배 남았는데 6.9%만 씀
#
# 즉 v_y 는 "천장이 낮아서", gamma 는 "분산이 안 커져서" 과신한다. 입력의존 잡음은
# 두 가지를 **동시에** 푼다 — 험한 구간에서 sigma_n^2(z) 가 커지면 천장 자체가
# 올라가고(v_y), 거리 계산과 무관하게 분산이 커진다(gamma).
#
# ## 안전장치
#
# 잡음 GP 는 타깃을 중심화해 학습하므로, **외삽 구간에서 평균이 0 으로 돌아가면
# sigma_n^2 이 학습 전체 평균 잡음으로 수렴한다** = 등분산 모델과 같은 값.
# 최악의 경우에도 종전보다 나빠지지 않는 구조다.
noise_model: input_dependent
noise_M: 500             # 잡음 함수는 평균 함수보다 매끄러워 적은 점으로 충분하다.

# --- 아래는 loop10.yaml 과 동일해야 한다 (비교 통제) ---
M: 2000
init_lengthscale: 1.0
init_sigma_f: 1.0
init_sigma_n: 0.1
sigma_n_floor: 1.0e-2    # 정칙화. 커버리지 맞추려고 만지지 마라.
jitter: 1.0e-8

train_experiment: gp_train_loop10

tuning_method: type2_ml + 2단계 이분산 학습 (사후 스케일링 아님)
tuning_budget_closed_loop_evals: 0
tuning_selection_scenario: part1_gp_lpf_ay4_het
