# loop10 학습 GP — **입력 워핑**(학습 범위 밖 거리 확대). 미결 #17(OOD 과신) 대응.
#
# 기준선 loop10.yaml 과 **warp_factor 하나만** 다르다.
#
# ## 왜 (2026-08-03 측정)
#
# 정상(stationary) 커널은 lengthscale 하나가 **두 가지를 동시에** 결정한다 —
# "함수가 얼마나 매끄러운가"와 "얼마나 멀어져야 모른다고 할 것인가". 평균함수가
# 매끄러워 lengthscale 이 길게 잡히면 GP 는 멀리까지 자신만만해진다. rtf_ay6 실측:
#
#   v_y 가 학습 범위(1~99%) 밖으로 나가는 비율 = 38.6%   (gamma 2.3%, delta 0.0%)
#   그런데 ARD 최근접거리 중앙값 = 0.96              (3 이상이어야 '멀다'로 인식)
#   -> Var[f*] 가 천장의 25%(v_y)/6.9%(gamma) 에 머물고 z_std=2.91 로 과신
#
# 워핑은 범위 **안에서는 항등**이라 학습 영역 적합을 바꾸지 않고, 밖에서만 거리를
# 늘려 Var[f*] 가 자라게 한다. 정상 커널 + 단조 변환이므로 여전히 유효한(PSD) 커널.
#
# ## factor 를 어떻게 골랐나 — 평가 시나리오를 보지 않았다
#
# `warp_factor` 는 **학습 데이터로 정할 수 없다**("범위 밖에서 얼마나 틀릴지"는 범위
# 안의 데이터가 알려줄 수 없다). Type-II ML 도 무관심하다. 평가 커버리지를 보고
# 고르면 분식이다. 그래서 `scripts/tune_input_warp.py` 가 **학습맵 안에서 강도 외삽
# 구조를 재현**해 고른다 (|gamma| 하위 80% 학습 / 상위 20% 검증):
#
#   factor    NLPD    z_std   95%커버   Var[f*]/천장
#      1.0  -3.240   1.668    71.3%      77.1%
#      2.0  -3.445   1.520    80.9%      86.3%
#     *4.0  -3.547   1.393    84.2%      93.7%   <- 채택 (수확체감 지점)
#      8.0  -3.618   1.249    86.0%      96.3%
#
# 8.0 이 NLPD 최소지만 4.0 과 2.0% 이내라 **더 작은 값**을 택했다(M 선택과 같은 규칙).
# Var[f*] 가 이미 천장의 93.7% 라 더 키워도 포화라서 얻을 게 거의 없다.
#
# ## ★ 한계 — 전이가 보장되지 않는다
#
# 내부 분할이 벗어나는 차원과 실제 OOD 가 벗어나는 차원이 **다르다**:
#   내부 OOD 분할: v_y 0.1%  / gamma 100.0% / delta 95.2%  (gamma 방향 외삽)
#   실제 rtf_ay6 : v_y 38.6% / gamma   2.3% / delta   0.0%  (v_y 방향 외삽)
# 모든 차원에 같은 factor 를 쓰므로 전이될 여지는 있으나 보장은 없다. 그리고 이 분할은
# 형상 외삽(racetrack)을 재현하지 못한다.
#
# ## 천장 자체의 한계 — 워핑으로 못 고치는 부분
#
# rtf_ay6 에서 v_y 의 실제 오차 1.411e-2 > 천장 sigma 1.006e-2 다. Var[f*] 가 천장에
# 완전히 도달해도 z_std 는 1.4 근처가 하한이다(현재 2.91). 천장은 sigma_f^2 이 정하고
# 그건 학습 데이터의 산포로 결정되므로, 워핑만으로는 넘을 수 없다.
warp_factor: 4.0
warp_quantile: 1.0       # 학습 범위를 [1%, 99%] 분위로 잡는다

# --- 아래는 loop10.yaml 과 동일해야 한다 (비교 통제) ---
M: 2000
init_lengthscale: 1.0
init_sigma_f: 1.0
init_sigma_n: 0.1
sigma_n_floor: 1.0e-2
jitter: 1.0e-8

train_experiment: gp_train_loop10

tuning_method: type2_ml + 내부 OOD 분할로 warp_factor 선택 (평가셋 미열람)
tuning_budget_closed_loop_evals: 0
tuning_selection_scenario: 내부 분할(|gamma| 상위 20%) — 평가 시나리오 아님
