# 공통 상태추정기 — 명목 4상태 순수 KF (Phase 8d).
#
# **모델 보정자(configs/ekf/*)와 역할이 다르다.** 이쪽은 잡음 낀 측정에서 상태를 복원해
# MPC 피드백에 넣는 것이 전부이고, 외란 추정·모델 보정에는 관여하지 않는다.
# 이 그룹을 참조하는 experiment 는 **세 케이스(mpc_only/kf/gp) 모두** 필터링된 x_hat 을
# 피드백받는다 — 상태추정 품질을 통제변수로 고정하기 위함이다.
#
# 상태·측정 순서 = [v_y, gamma, e_psi, e_y] (전상태 직접 관측, H = I4).

# 프로세스 잡음 연속 공분산 대각(4). predict 에서 *dt 이산화.
#
# 명목 모델은 선형 타이어라 비선형 플랜트 대비 오차가 있고, 그 크기는 Phase 5 에서
# 측정했다(잔차 RMS: v_y 1.30e-2 m/s, gamma 1.21e-3 rad/s per dt=0.02 스텝
# -> 연속 환산 약 0.65 m/s^2, 0.06 rad/s^2). Q 는 그 제곱 스케일에서 출발한다.
#   v_y   : 0.65^2 ~= 0.42  -> 0.5
#   gamma : 0.06^2 ~= 0.004 -> 0.01 (약간 여유)
# 기구학 2식(e_psi, e_y)은 vx·kappa 가 정확하면 오차가 없으므로 아주 작게 둔다.
#
# 주의: 이 값은 **외란을 증강하지 않은** 필터의 프로세스 잡음이다. 모델 오차를 상태로
# 추정하지 않고 잡음으로 뭉뚱그려 흡수시키는 설계이므로, 외란증강 KF(ekf/*)의 Q_kf 와
# 같은 값일 이유가 없다.
# **튜닝 결과 반영 (아래 tuning_* 참조)**: 위 출발값에서 동적 채널 스케일 0.1 이 최적.
Q_diag: [5.0e-2, 1.0e-3, 1.0e-8, 1.0e-8]

# 측정 잡음 공분산 대각(4) = 센서 사양과 정확히 일치 (configs/sensor/realistic.yaml
# noise_std [0.03, 0.002, 0.003, 0.03] 의 제곱). 실차에서도 R 은 데이터시트에서 온다.
R_diag: [9.0e-4, 4.0e-6, 9.0e-6, 9.0e-4]

# 초기 추정 공분산 대각(4). 초기 상태를 모른다고 보수적으로 둔다.
P0_diag: [0.5, 0.05, 0.01, 0.01]

# 공정성: 이 필터는 **세 케이스 공통**이라 어느 한쪽을 유리하게 만들지 않는다.
# 튜닝 목적함수는 추종오차가 아니라 **상태추정 RMSE** 로 둔다 — 상태추정기의 본래
# 목적이고, 추종 기준으로 튜닝하면 미결 #4(목적함수 불일치)를 되풀이하게 된다.
# 목적함수 = 측정잡음 std 로 정규화한 채널별 추정 RMSE 의 합 (1.0 = 생측정 수준, <1 = 개선).
# 동적 채널(v_y, gamma) Q 스케일 7점 그리드, in-distribution(rtn_ay4)만 관측:
#   1.0 -> 2.337 | 0.3 -> 2.201 | **0.1 -> 2.038 (최적)** | 0.03 -> 2.103
#   0.01 -> 2.872 | 3e-3 -> 4.850 | 1e-3 -> 7.590
# 0.1 아래로 내리면 오히려 나빠진다 — 명목 모델(선형 타이어)이 실제로 틀렸으므로
# 모델을 과신하면 편향이 커진다. 이 U자 곡선의 바닥이 "모델을 얼마나 믿을지"의 답이다.
tuning_method: closed_loop_grid_on_estimation_rmse
tuning_budget_closed_loop_evals: 7    # 예산 20 이내
tuning_selection_scenario: part1_mpc_only_rtn_ay4   # in-distribution 만. 외삽 열람 금지
