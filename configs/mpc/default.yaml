# 명목 MPC 기본 설정 (.claude/rules/mpc-solver.md).
#
# 가중치 이름은 KF 잡음 공분산(Q_kf, R_kf)과 절대 겹치지 않게 짓는다.
# practice1 의 R, R_d 이름은 쓰지 않는다.
# dt_ctrl 은 여기 두지 않는다 — SimConfig 가 단일 소스, 컨트롤러 생성 시 주입.
#
# 아래 가중치는 제안 기본값이다 (TODO: 폐루프 추종성능을 보고 튜닝).
# 튜닝 예산은 GP/EKF 와 같은 형식으로 기록한다 (ekf-baseline.md 공정성).

N: 60                 # 예측 지평 [스텝]. dt_ctrl=0.02 -> 1.2 s. vx~14 에서 약 16.8 m 프리뷰.
                      # 30 -> 60 (2026-07-30 사용자 지시, 실험 설계 재설정).
                      # 결정변수가 배로 늘어난다: X 4x(N+1), U 1xN -> 154 -> 304.
                      # **실시간성 주의**: N=30 에서 이미 solve p95 가 dt_ctrl(20 ms)을
                      #   넘고 있었다 (필터 구성 14~17 ms, 생측정 구성 24~35 ms).
                      #   N=60 이면 더 커진다. 측정 전에는 수치를 추정하지 마라 —
                      #   실행 후 dt_exceed / solve_ms_p95 를 반드시 확인할 것.

# 스테이지 상태 가중치 (추종오차 우선, 동적상태는 작은 정규화)
W_ey: 10.0            # 횡방향오차 e_y [1/m^2]
W_epsi: 5.0           # 헤딩오차 e_psi [1/rad^2]
W_vy: 0.0            # 0 으로 고정 (2026-07-27). 정상선회에서 필요한 v_y 는 0 이 아니라
                     #   경로가 정하는 값이다. 크기를 벌주면 추종과 충돌한다.
                     #   gamma 처럼 참조 상대로 고칠 수도 없다 — v_y 참조는 선형 정상상태해라
                     #   비선형 플랜트 대비 -206.6% 틀린다. 근거는 mpc-solver.md.
W_gamma: 0.1         # 요레이트 추종 (gamma - vx*kappa)^2 — 이 항만 참조 상대.
                     #   절대값 gamma^2 를 벌주면 곡선에서 필요한 요레이트와 충돌한다
                     #   (mpc-solver.md 예외 규정, 2026-07-27).

# 입력 가중치
R_delta: 0.0         # 0 으로 고정 (2026-07-27). W_vy 와 같은 이유 — 정상선회의 delta 는
                     #   경로가 정한다. 전륜 포화 방어는 하드제약 |delta|<=delta_max 가,
                     #   평활화는 R_ddelta(변화율)가 맡는다. 크기 페널티가 할 일이 없다.
R_ddelta: 10.0       # 조향각 변화율 (평활화). 정상상태에서 0 이므로 상충 없음 — 유일하게
                     #   구조가 옳은 입력 항이다.
                     # TODO: raw 차분을 벌주므로 유효 rate 가중이 R_ddelta*dt_ctrl^2 이다.
                     #   dt_ctrl 을 바꾸면 튜닝이 dt^2 로 같이 변한다. 값을 올리는 실험은
                     #   해봤고 나빴다 (유효가중 1.0 등가 -> ay4 RMS e_y 2.7배 악화).

# 종단 가중치 (추종오차만)
Wf_ey: 20.0
Wf_epsi: 10.0

# IPOPT 옵션 — 케이스 간 동일하게 유지 (다르면 solve time 비교 무의미)
ipopt:
  max_iter: 200
  tol: 1.0e-8
  print_level: 0

  # ---- warm start 활성화 (2026-07-30) ----
  # mpc_base.py 는 처음부터 이전 해를 shift 해 set_initial 로 넣고 있었으나, IPOPT
  # 기본값이 warm_start_init_point=no 라 **그 초기추정을 버리고** 있었다(초기점을
  # 경계 안쪽으로 밀어내고 배리어·승수를 매번 처음부터 잡는다). 즉 초기추정을
  # 만들어 두고 쓰지 않던 상태였다.
  #
  # 측정 (loop10 전체 랩, 비선형 플랜트, N=50):
  #   끄면  solve mean 11.34 ms  p95 13.63  IPOPT iter 4.5   RMS e_y 7.6630e-03
  #   켜면  solve mean  8.79 ms  p95 14.22  IPOPT iter 2.8   RMS e_y 7.6630e-03
  # 반복수 -38%, 평균 solve -22%. **RMS e_y 는 소수 5자리까지 동일** — 정확도를 팔아
  # 속도를 산 것이 아니다. 수렴 실패 0. 상세는 mpc-solver.md 「솔버 운영」.
  #
  # "yes" 는 반드시 인용부호로 쓴다 — YAML 1.1 은 따옴표 없는 yes 를 boolean True 로
  # 읽고, IPOPT 는 이 옵션에 문자열 "yes"/"no" 를 받는다.
  warm_start_init_point: "yes"
  # 초기점을 경계에서 얼마나 밀어낼지. 기본 0.01 은 warm start 를 무의미하게 만들 만큼
  # 크다. 거의 0 으로 둬 이전 해를 그대로 쓰게 한다.
  warm_start_bound_push: 1.0e-8
  warm_start_mult_bound_push: 1.0e-8
  # 배리어 파라미터 초기값. 기본 0.1 은 해에서 멀어 반복을 낭비한다. 이전 해 근처에서
  # 출발하므로 작게 둔다.
  mu_init: 1.0e-4
